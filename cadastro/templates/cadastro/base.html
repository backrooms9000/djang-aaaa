<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block titulo %}Meu Site{% endblock %}</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'cadastro/style.css' %}">
</head>

<body>

    <header>
        <h1>Cadastro</h1>
    </header>

    <nav>
        <a href="{% url 'index' %}">Início</a> |
        <a href="{% url 'contato' %}">Contato</a> |
        <a href="{% url 'adicionar' %}">Adicionar</a> |

        {% if user.is_authenticated %}
            Olá, {{ user.username }}! |

            <form method="POST" action="{% url 'logout' %}"
                  style="display: inline;">
                {% csrf_token %}
                <button type="submit">Sair</button>
            </form>
        {% else %}
            <a href="{% url 'login' %}">Entrar</a>
        {% endif %}
    </nav>

    <hr>

    <main>
        {% block conteudo %}
        {% endblock %}
    </main>

    <hr>

    <footer>
        <p>&copy; 2026 {{ nome|default:"visitante" }}</p>
    </footer>

</body>
</html>
